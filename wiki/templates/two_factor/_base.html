{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al panel - Wiki PG</title>
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
    <link rel="stylesheet" href="{% static 'css/wiki.css' %}?v=6">
    <link rel="icon" href="{% static 'favicon.ico' %}?v=4" sizes="any">
    <link rel="icon" href="{% static 'icons/favicon.svg' %}?v=4" type="image/svg+xml">
    <style>
        body { align-items: center; justify-content: center; padding: 1.5rem 1rem; }
        .login-container {
            width: 100%; max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 2rem;
        }
        .login-logo { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.75rem; font-weight: 700; font-size: 1.05rem; color: var(--ink); text-decoration: none; }
        .login-container h1 { font-size: var(--fs-2); line-height: 1.2; margin-bottom: 0.5rem; }
        .login-container p { color: var(--ink-2); font-size: 0.95rem; margin-bottom: 1.25rem; }
        .login-container label { display: block; font-size: 0.875rem; font-weight: 700; color: var(--ink); margin-bottom: 0.35rem; }
        .login-container input[type="text"], .login-container input[type="password"],
        .login-container input[type="number"], .login-container input[type="email"], .login-container input[type="tel"] {
            width: 100%;
            padding: 0.7rem 0.85rem;
            background: var(--bg);
            border: 1px solid var(--line-strong);
            border-radius: 6px;
            color: var(--ink);
            font: inherit;
            margin-bottom: 1rem;
        }
        .login-container input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .btn-primary, .login-container button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent); color: var(--accent-ink);
            border: 0; border-radius: 6px;
            font: inherit; font-weight: 700;
            cursor: pointer;
        }
        .btn-primary:hover, .login-container button[type="submit"]:hover { filter: brightness(1.08); }
        .btn-secondary, .login-container button.btn-secondary {
            width: 100%;
            padding: 0.7rem;
            margin-top: 0.5rem;
            background: transparent; color: var(--ink-2);
            border: 1px solid var(--line-strong); border-radius: 6px;
            font: inherit;
            cursor: pointer;
        }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
        .errorlist { color: #C4320A; font-size: 0.875rem; margin-bottom: 1rem; list-style: none; }
        :root[data-theme="dark"] .errorlist { color: #F28B82; }
    </style>
</head>
<body>
    <main class="login-container">
        <a class="login-logo" href="/"><span class="brand-mark" aria-hidden="true">PG</span>Wiki PG</a>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
