{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del servidor - Wiki PG</title>
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
    <link rel="stylesheet" href="{% static 'css/wiki.css' %}?v=7">
    <link rel="icon" href="{% static 'favicon.ico' %}?v=4" sizes="any">
    <link rel="icon" href="{% static 'icons/favicon.svg' %}?v=4" type="image/svg+xml">
</head>
<body>
    <main class="main" style="margin: 0 auto; max-width: 720px;">
        <div class="error-page">
            <p class="code">Error 500</p>
            <h1 class="page-title">El servidor ha fallado al generar esta página</h1>
            <p>El error ha quedado registrado. Vuelve a cargar dentro de un momento; si sigue fallando, el problema está en el servidor y no en tu conexión.</p>
            <p><a href="/">Volver al inicio</a></p>
        </div>
    </main>
</body>
</html>
