{% load static %}

<button id="term-fab" type="button" title="Abrir terminal" aria-label="Abrir terminal" style="position:fixed; bottom:24px; right:24px; width:58px; height:58px; border-radius:50%; background:var(--surface); border:1px solid var(--line-strong); box-shadow:0 8px 24px rgba(0,0,0,0.4); cursor:pointer; z-index:1000; display:flex; align-items:center; justify-content:center; transition:transform 0.15s;">
  <span style="font-family:var(--font-mono); color:var(--accent); font-size:1.3rem; font-weight:700;">&gt;_</span>
</button>

<div id="term-window" style="position:fixed; bottom:94px; right:24px; width:min(440px, calc(100vw - 32px)); height:min(540px, calc(100vh - 140px)); background:#1e1e1e; border-radius:14px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.08); z-index:1000; display:none; flex-direction:column;">
  <div id="term-header" style="background:#1a1a1a; padding:0.7rem 1rem; display:flex; align-items:center; gap:0.5rem; border-bottom:1px solid rgba(255,255,255,0.05); flex-shrink:0;">
    <span id="term-btn-close" title="Cerrar" style="width:13px;height:13px;background:#ff5f57;border-radius:50%;cursor:pointer;"></span>
    <span id="term-btn-min" title="Minimizar" style="width:13px;height:13px;background:#febc2e;border-radius:50%;cursor:pointer;"></span>
    <span id="term-btn-max" title="Maximizar" style="width:13px;height:13px;background:#28c840;border-radius:50%;cursor:pointer;"></span>
    <span style="flex:1; text-align:center; color:#888; font-size:0.76rem; font-family:var(--font-mono);">pgg@wiki: ~</span>
    <span style="width:52px;"></span>
  </div>
  <div id="term-body" style="flex:1; padding:1rem 1.1rem; overflow-y:auto; font-family:var(--font-mono); font-size:0.85rem; line-height:1.6; color:#d4d4d4; cursor:text;">
    <div id="term-output"></div>
    <div id="term-prompt-line" style="display:flex; align-items:center;">
      <span style="color:#28c840;">pgg@wiki</span><span style="color:#666;">:</span><span style="color:#4f8ef7;">~</span><span style="color:#666;">$&nbsp;</span>
      <input id="term-input" autocomplete="off" style="flex:1; background:transparent; border:none; outline:none; color:#d4d4d4; font-family:var(--font-mono); font-size:16px;">
    </div>
  </div>
</div>
<script src="{% static 'js/terminal.js' %}?v=1" defer></script>
