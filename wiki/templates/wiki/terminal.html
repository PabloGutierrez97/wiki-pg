{% extends 'wiki/base.html' %}
{% block title %}Terminal - Wiki PG{% endblock %}

{% block content %}
<div style="max-width: 900px; margin: 0 auto;">
  <div style="background:#1e1e1e; border-radius:14px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.06);">

    <div style="background:#1a1a1a; padding:0.7rem 1.1rem; display:flex; align-items:center; gap:0.5rem; border-bottom:1px solid rgba(255,255,255,0.05);">
      <span style="width:12px;height:12px;background:#ff5f57;border-radius:50%;display:inline-block;"></span>
      <span style="width:12px;height:12px;background:#febc2e;border-radius:50%;display:inline-block;"></span>
      <span style="width:12px;height:12px;background:#28c840;border-radius:50%;display:inline-block;"></span>
      <span style="flex:1; text-align:center; color:#888; font-size:0.78rem; font-family:var(--font-mono);">pgg@wiki: ~</span>
      <span style="width:52px;"></span>
    </div>

    <div id="term-body" style="padding:1.25rem; height:62vh; min-height:380px; overflow-y:auto; font-family:var(--font-mono); font-size:0.9rem; line-height:1.65; color:#d4d4d4; cursor:text;">
      <div id="term-output"></div>
      <div style="display:flex; align-items:center;">
        <span style="color:#28c840;">pgg@wiki</span><span style="color:#666;">:</span><span style="color:#4f8ef7;">~</span><span style="color:#666;">$&nbsp;</span>
        <input id="term-input" autocomplete="off" autofocus
               style="flex:1; background:transparent; border:none; outline:none; color:#d4d4d4; font-family:var(--font-mono); font-size:0.9rem;">
      </div>
    </div>

  </div>
  <p style="text-align:center; color:var(--text-muted); font-size:0.8rem; margin-top:0.9rem; font-family:var(--font-mono);">
    Escribe <span style="color:var(--accent);">help</span> y pulsa Enter para empezar
  </p>
</div>

<script>
(function() {
  const body = document.getElementById('term-body');
  const output = document.getElementById('term-output');
  const input = document.getElementById('term-input');
  const history = [];
  let histIdx = -1;

  const banner =
    "  Wiki PG — Terminal interactivo\n" +
    "  ------------------------------\n" +
    "  Explora la wiki como si fuera un servidor.\n" +
    "  Escribe 'help' para ver los comandos disponibles.\n";

  function esc(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function print(text, promptLine) {
    const div = document.createElement('div');
    if (promptLine) {
      div.innerHTML = '<span style="color:#28c840;">pgg@wiki</span><span style="color:#666;">:</span>' +
        '<span style="color:#4f8ef7;">~</span><span style="color:#666;">$</span> ' + esc(text);
    } else {
      div.style.whiteSpace = 'pre-wrap';
      div.style.margin = '0.15rem 0 0.6rem';
      div.innerHTML = text;
    }
    output.appendChild(div);
  }

  print(banner.replace(/&/g,'&amp;'), false);

  function run(cmd) {
    print(cmd, true);
    fetch('/terminal/cmd/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({command: cmd})
    })
    .then(r => r.json())
    .then(data => {
      if (data.clear) { output.innerHTML = ''; return; }
      if (data.output) {
        let html = esc(data.output);
        html = html.replace(/(\/article\/[a-z0-9\-]+\/)/g,
          '<a href="$1" style="color:#4f8ef7;">$1</a>');
        print(html, false);
      }
      body.scrollTop = body.scrollHeight;
    })
    .catch(() => { print('Error de conexion.', false); body.scrollTop = body.scrollHeight; });
  }

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const cmd = input.value.trim();
      input.value = '';
      if (cmd) { history.unshift(cmd); histIdx = -1; run(cmd); }
      else { print('', true); }
      setTimeout(() => body.scrollTop = body.scrollHeight, 30);
    } else if (e.key === 'ArrowUp') {
      if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }
      e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      if (histIdx > 0) { histIdx--; input.value = history[histIdx]; }
      else { histIdx = -1; input.value = ''; }
      e.preventDefault();
    }
  });

  body.addEventListener('click', () => input.focus());
})();
</script>
{% endblock %}
