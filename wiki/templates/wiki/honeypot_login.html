<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wiki PG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0f19;
            color: #cbd5e1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: #151b2c;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
        }
        .login-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .login-logo-badge {
            background: #0284c7;
            color: white;
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
        }
        .login-logo-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e2e8f0;
        }
        h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; color: #e2e8f0; }
        p { color: #64748b; font-size: 0.875rem; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.8rem; font-weight: 500; color: #94a3b8; margin-bottom: 0.4rem; }
        input[type="text"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0b0f19;
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            transition: border 0.2s;
        }
        input:focus { outline: none; border-color: #0284c7; }
        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #0369a1; }
        .errorlist { color: #ef4444; font-size: 0.8rem; margin-bottom: 1rem; list-style: none; }
        a { color: #0284c7; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <span class="login-logo-badge">PG</span>
            <span class="login-logo-text">Wiki PG</span>
        </div>
        <h1>Iniciar sesión</h1>
        <p>Introduce tus credenciales para acceder.</p>
        {% if error %}
        <ul class="errorlist"><li>Usuario o contraseña incorrectos. Inténtalo de nuevo.</li></ul>
        {% endif %}
        <form method="post">{% csrf_token %}
            <label>Usuario</label>
            <input type="text" name="username" autofocus>
            <label>Contraseña</label>
            <input type="password" name="password">
            <button type="submit" class="btn-primary">Acceder</button>
        </form>
    </div>
</body>
</html>
